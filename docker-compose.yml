version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: spotly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spotly_users}
      MYSQL_USER: ${MYSQL_USER:-spotly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spotlypass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spotly-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - spotly-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - spotly-network
    restart: unless-stopped

  solr:
    image: solr:9
    container_name: solr
    ports:
      - "${SOLR_PORT:-8983}:8983"
    volumes:
      - solr_data:/var/solr
    command:
      - solr-precreate
      - ${SOLR_CORE:-properties}
    networks:
      - spotly-network
    restart: unless-stopped

  memcached:
    image: memcached:alpine
    container_name: memcached
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    networks:
      - spotly-network
    restart: unless-stopped

  users-api:
    build: ./backend/users-api
    container_name: users-api
    ports:
      - "${USERS_API_PORT:-8081}:${USERS_API_PORT:-8081}"
    environment:
      SERVER_PORT: ${USERS_API_PORT:-8081}
      DB_HOST: ${MYSQL_HOST:-spotly-mysql}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_USER: ${MYSQL_USER:-spotly}
      DB_PASSWORD: ${MYSQL_PASSWORD:-spotlypass}
      DB_NAME: ${MYSQL_DATABASE:-spotly_users}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-min-32-chars}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spotly-network
    restart: unless-stopped

  properties-api:
    build: ./backend/properties-api
    container_name: spotly-properties-api
    ports:
      - "${PROPERTIES_API_EXTERNAL_PORT:-8082}:${PROPERTIES_API_PORT:-8081}"
    environment:
      SERVER_PORT: ${PROPERTIES_API_PORT:-8081}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/spotly_properties}
      MONGO_DATABASE: ${MONGO_DATABASE:-spotly_properties}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      USERS_API_URL: ${USERS_API_URL:-http://users-api:8081}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-min-32-chars}
    volumes:
      - property_images:/app/uploads/images
    depends_on:
      - mongodb
      - rabbitmq
      - users-api
    networks:
      - spotly-network
    restart: unless-stopped

  search-api:
    build: ./backend/search-api
    container_name: spotly-search-api
    ports:
      - "${SEARCH_API_PORT:-8083}:${SEARCH_API_PORT:-8083}"
    environment:
      SERVER_PORT: ${SEARCH_API_PORT:-8083}
      SOLR_URL: ${SOLR_URL:-http://solr:8983/solr/properties}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      MEMCACHED_ADDR: ${MEMCACHED_ADDR:-memcached:11211}
      PROPERTIES_API_URL: ${PROPERTIES_API_URL:-http://spotly-properties-api:8081/api}
    depends_on:
      - solr
      - rabbitmq
      - memcached
      - properties-api
    networks:
      - spotly-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: spotly-frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - spotly-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: spotly-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - property_images:/usr/share/nginx/html/images:ro
    depends_on:
      - users-api
      - properties-api
      - search-api
      - frontend
    networks:
      - spotly-network
    restart: unless-stopped

volumes:
  mysql_data:
  mongo_data:
  rabbitmq_data:
  solr_data:
  frontend_dist:
  property_images:

networks:
  spotly-network:
    driver: bridge
